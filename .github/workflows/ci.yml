name: CI

on:
    push:
        branches:
            - main
            - "feature/**"
            - "fix/**"
            - "config/**"
            - "docs/**"
    pull_request:
        branches:
            - main

jobs:
    test:
        name: Format and Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"

            - name: Verify formatting
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      echo "These files are not formatted:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Run tests
              run: go test ./...
